function statementCanvas(off, scale){
  var r = statementOps(off), s = scale || 2;
  var cv = document.createElement("canvas");
  cv.width = SW * s; cv.height = Math.ceil(r.height) * s;
  var g = cv.getContext("2d");
  g.scale(s, s);
  g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, SW, r.height);
  g.textBaseline = "alphabetic";
  r.ops.forEach(function(o){
    if(o.op === "r" || o.op === "rs"){
      var rr = Math.min(o.r || 0, o.h / 2, o.w / 2);
      g.beginPath();
      if(rr > 0 && g.roundRect) g.roundRect(o.x, o.y, o.w, o.h, rr);
      else g.rect(o.x, o.y, o.w, o.h);
      if(o.op === "rs"){ g.strokeStyle = o.c; g.lineWidth = 1.4; g.stroke(); }
      else { g.fillStyle = o.c; g.fill(); }
    }else if(o.op === "d"){
      g.fillStyle = o.c; g.beginPath();
      if(g.roundRect){ g.roundRect(o.x, o.y, 14, 14, 4); } else { g.rect(o.x, o.y, 14, 14); }
      g.fill();
    }else{
      g.font = o.f; g.fillStyle = o.c; g.textAlign = o.a;
      var t = o.t;
      if(o.max){
        while(t.length > 1 && g.measureText(t).width > o.max) t = t.slice(0, -2) + "\u2026";
      }
      g.fillText(t, o.x, o.y);
    }
  });
  return cv;
}

function downloadStatementImage(off){
  try{
    var c = cycle(new Date(), off || 0);
    var name = "\u6d88\u8d39\u62a5\u8868-" + c.start.getFullYear() + "-" + pad2(c.start.getMonth()+1) + ".png";
    var cv = statementCanvas(off || 0, 2);
    if(cv.toBlob){
      cv.toBlob(function(blob){
        if(!blob) return toast("Could not make the image");
        var u = URL.createObjectURL(blob), a = document.createElement("a");
        a.href = u; a.download = name; document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 1200);
        toast("\u56fe\u7247\u5df2\u4fdd\u5b58");
      }, "image/png");
    }else{
      var a2 = document.createElement("a");
      a2.href = cv.toDataURL("image/png"); a2.download = name;
      document.body.appendChild(a2); a2.click(); a2.remove();
      toast("\u56fe\u7247\u5df2\u4fdd\u5b58");
    }
  }catch(e){ toast("Could not make the image"); }
}

/* ---------- automatic monthly deposit ---------- */
function syncAutoDeposits(){
  var st = S.settings;
  S.deposits = S.deposits.filter(function(d){ return !d.auto; });
  var into = acctOf(st.depositAcct) || acctOf(st.defaultAcct);
  if(st.autoDeposit === false || !(+st.allowance > 0) || !into) return;
  var d = cycle(new Date(), 0).start, from = fromISO(into.openingDate), guard = 0;
  /* strictly after: the balance you typed was read on that date, so it already
     includes any money that landed that day */
  while(d > from && guard++ < 240){
    var k = iso(d);
    if(!S.deposits.some(function(x){ return !x.auto && x.date === k; }))
      S.deposits.push({id:"auto_" + k, date:k, amt:+st.allowance, note:"", auto:true, acct:into.id});
    d = addMonths(d, -1);
  }
}

/* ---------- cloud sync (Firebase) ----------
   This device's copy (localStorage) stays the working copy, so the app keeps
   working offline. The cloud holds the same records split into small docs:
     users/{uid}/chunks/core   settings, types, accounts, bills, deletion markers
     users/{uid}/chunks/y2026  that year's expenses, money in and transfers
   Every record carries the time it was last changed, and deleting leaves a
   marker. Devices MERGE record by record (newest change wins) instead of
   overwriting each other, so an expense logged offline on the phone and one
   logged on the PC both survive. Automatic monthly deposits are never
   uploaded; each device rebuilds them from settings. */
var SYNC = {state:"idle", err:"", user:null, ready:false, unsub:null, cloud:{}, latest:null,
            hold:false, deferred:false, choice:null, fbReady:false, fbFailed:false};
var SYNC_FLAG = "spend_sync_uid", META_KEY = "spend_sync_meta";
var COLS = ["cats","accounts","bills","expenses","deposits","transfers"];
var YEAR_COLS = {expenses:1, deposits:1, transfers:1};
var KEEP_GONE = 180 * 86400000;
var DEVICE = (function(){
  try{ var d = localStorage.getItem("spend_device");
       if(!d){ d = uid(); localStorage.setItem("spend_device", d); } return d; }
  catch(e){ return uid(); }
})();
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }

/* change times per record: M.m["expenses:abc"] = ms, M.gone[...] = when deleted */
var M = (function(){ try{ var o = JSON.parse(lsGet(META_KEY)); if(o && o.m && o.gone) return o; }catch(e){} return {m:{}, gone:{}}; })();
var LASTREC = null;
function saveMeta(){ lsSet(META_KEY, JSON.stringify(M)); }
function colList(st, col){
  var a = st[col] || [];
  return col === "deposits" ? a.filter(function(d){ return !d.auto; }) : a;
}
function recMap(st){
  var out = {settings: JSON.stringify(st.settings)};
  COLS.forEach(function(col){
    colList(st, col).forEach(function(r){ if(r && r.id != null) out[col + ":" + r.id] = JSON.stringify(r); });
  });
  return out;
}
/* stamp whatever changed since the last save on this device */
function trackLocal(){
  var now = recMap(S), t = Date.now(), k;
  if(!LASTREC){ LASTREC = now; return; }
  for(k in now) if(now[k] !== LASTREC[k]){ M.m[k] = t; delete M.gone[k]; }
  for(k in LASTREC) if(!(k in now)){ M.gone[k] = t; delete M.m[k]; }
  LASTREC = now; saveMeta();
}

function yearOf(s){ return "y" + (/^\d{4}/.test(s || "") ? s.slice(0,4) : "0000"); }
function chunksOf(st, meta){
  var core = {settings:st.settings, cats:st.cats, accounts:st.accounts, bills:st.bills, m:{}, gone:meta.gone || {}};
  if(meta.m.settings) core.m.settings = meta.m.settings;
  ["cats","accounts","bills"].forEach(function(col){
    st[col].forEach(function(r){ var k = col + ":" + r.id; if(meta.m[k]) core.m[k] = meta.m[k]; });
  });
  var out = {core: JSON.stringify(core)}, yrs = {};
  function b(y){ return yrs[y] || (yrs[y] = {expenses:[], deposits:[], transfers:[], m:{}}); }
  Object.keys(YEAR_COLS).forEach(function(col){
    colList(st, col).forEach(function(r){
      var y = b(yearOf(r.date)), k = col + ":" + r.id;
      y[col].push(r); if(meta.m[k]) y.m[k] = meta.m[k];
    });
  });
  Object.keys(yrs).forEach(function(y){ out[y] = JSON.stringify(yrs[y]); });
  return out;
}
var EMPTY_YEAR = JSON.stringify({expenses:[], deposits:[], transfers:[], m:{}});
function assemble(map){
  var o = {st:{settings:{}, cats:[], accounts:[], bills:[], expenses:[], deposits:[], transfers:[]}, m:{}, gone:{}};
  if(map.core){ try{ var c = JSON.parse(map.core);
    o.st.settings = c.settings || {}; o.st.cats = c.cats || []; o.st.accounts = c.accounts || []; o.st.bills = c.bills || [];
    o.gone = c.gone || {}; if(c.m) Object.keys(c.m).forEach(function(k){ o.m[k] = c.m[k]; }); }catch(e){} }
  /* a record moved to another year can briefly sit in two chunks: keep the newest copy */
  var at = {};
  Object.keys(map).filter(function(k){ return k !== "core"; }).sort().forEach(function(key){
    var y; try{ y = JSON.parse(map[key]); }catch(e){ return; }
    var ym = y.m || {};
    Object.keys(YEAR_COLS).forEach(function(col){
      (y[col] || []).forEach(function(r){
        if(!r || r.id == null) return;
        var k = col + ":" + r.id, m = ym[k] || 0;
        if(k in at){
          if(m > (o.m[k] || 0)){ o.st[col][at[k]] = r; o.m[k] = m; }
          return;
        }
        at[k] = o.st[col].length; o.st[col].push(r);
        if(m) o.m[k] = m;
      });
    });
  });
  return o;
}
/* newest change wins per record; a deletion beats anything older than it */
function mergeAll(L, R){
  var out = {st:{}, m:{}, gone:{}};
  var ls = L.m.settings || 0, rs = R.m.settings || 0, lj = JSON.stringify(L.st.settings), rj = JSON.stringify(R.st.settings);
  out.st.settings = (rs > ls || (rs === ls && rj >= lj)) ? R.st.settings : L.st.settings;
  if(Math.max(ls, rs)) out.m.settings = Math.max(ls, rs);
  COLS.forEach(function(col){
    var li = {}, ri = {}, order = [];
    colList(R.st, col).forEach(function(r){ if(r && r.id != null && !(r.id in ri)){ ri[r.id] = r; order.push(r.id); } });
    colList(L.st, col).forEach(function(r){ if(r && r.id != null && !(r.id in li)){ li[r.id] = r; if(!(r.id in ri)) order.push(r.id); } });
    out.st[col] = [];
    order.forEach(function(id){
      var k = col + ":" + id, lr = li[id], rr = ri[id];
      var lm = lr ? (L.m[k] || 0) : -1, rm = rr ? (R.m[k] || 0) : -1, best, bm = Math.max(lm, rm);
      if(lm > rm) best = lr; else if(rm > lm) best = rr;
      else best = (lr && rr) ? (JSON.stringify(rr) >= JSON.stringify(lr) ? rr : lr) : (rr || lr);
      var g = Math.max(L.gone[k] || -1, R.gone[k] || -1);
      if(g >= 0 && g >= bm){ out.gone[k] = g; return; }
      out.st[col].push(best); if(bm > 0) out.m[k] = bm;
    });
  });
  var cut = Date.now() - KEEP_GONE;
  [L.gone, R.gone].forEach(function(G){
    Object.keys(G).forEach(function(k){
      if(G[k] < cut || out.m[k] !== undefined) return;
      var ok = true;
      COLS.forEach(function(col){ if(k.indexOf(col + ":") === 0){
        var id = k.slice(col.length + 1);
        if(out.st[col].some(function(r){ return String(r.id) === id; })) ok = false; } });
      if(ok) out.gone[k] = Math.max(out.gone[k] || 0, G[k]);
    });
  });
  if(!out.st.cats.length) out.st.cats = L.st.cats.length ? L.st.cats : R.st.cats;
  return out;
}
function isEmptyState(st){
  return !st.expenses.length && !st.accounts.length && !st.transfers.length &&
         !st.deposits.some(function(d){ return !d.auto; }) && !(+st.settings.allowance);
}
function knownDevice(){ return !!SYNC.user && lsGet(SYNC_FLAG) === SYNC.user.uid; }
function sameRecords(a, b){
  var x = recMap(a), y = recMap(b);
  var kx = Object.keys(x).sort(), ky = Object.keys(y).sort();
  if(kx.join("|") !== ky.join("|")) return false;
  return kx.every(function(k){ return x[k] === y[k]; });
}

/* every local save: stamp changes, then push them if we're connected */
function cloudAfterSave(){
  trackLocal();
  if(SYNC.ready) pushNow();
}
function writeLocal(){
  var txt = JSON.stringify(S);
  try{ localStorage.setItem(KEY, txt); storageOK = true; }catch(e){ storageOK = false; }
  idbPut(KEY, txt);
  LASTREC = recMap(S); saveMeta();
}
function pushNow(){
  var FB = window.FB;
  if(!SYNC.ready || !FB || !SYNC.user) return;
  var local = chunksOf(S, M), ids = {}, k, changed = [];
  for(k in local) ids[k] = 1;
  for(k in SYNC.cloud) ids[k] = 1;
  Object.keys(ids).forEach(function(id){
    var j = local[id] || (id === "core" ? null : EMPTY_YEAR);
    if(j != null && SYNC.cloud[id] !== j) changed.push([id, j]);
  });
  if(!changed.length) return;
  var batch = FB.writeBatch(FB.db), prev = {};
  changed.forEach(function(c){
    prev[c[0]] = SYNC.cloud[c[0]];
    SYNC.cloud[c[0]] = c[1];
    batch.set(FB.doc(FB.db, "users", SYNC.user.uid, "chunks", c[0]),
      {json:c[1], at:FB.serverTimestamp(), dev:DEVICE});
  });
  setSync(navigator.onLine === false ? "offline" : "saving");
  batch.commit().then(function(){
    if(SYNC.state === "saving" || SYNC.state === "offline") setSync("synced");
  }).catch(function(e){
    Object.keys(prev).forEach(function(id){
      if(prev[id] === undefined) delete SYNC.cloud[id]; else SYNC.cloud[id] = prev[id];
    });
    setSync("error", errText(e));
  });
}

/* merge a cloud snapshot into this device, then send back anything the cloud lacks */
function mergeFromCloud(map, push){
  SYNC.cloud = Object.assign({}, map);
  var R = assemble(map);
  var merged = mergeAll({st:S, m:M.m, gone:M.gone}, R);
  M = {m:merged.m, gone:merged.gone};
  if(!sameRecords(merged.st, S) || JSON.stringify(merged.st.cats) !== JSON.stringify(S.cats)){
    S = normalize(merged.st);
    syncAutoDeposits();
    writeLocal();
    render();
  }else saveMeta();
  if(push) pushNow();
}
function onChunks(snap){
  var map = {};
  snap.docs.forEach(function(d){ var x = d.data(); if(x && typeof x.json === "string") map[d.id] = x.json; });
  SYNC.latest = {map:map, fromCache:snap.metadata.fromCache};
  if(SYNC.ready && !snap.metadata.fromCache && !snap.metadata.hasPendingWrites) setSync("synced");
  if(SYNC.hold){ SYNC.deferred = true; return; }
  processLatest();
}
function processLatest(){
  var L = SYNC.latest;
  if(!L || !SYNC.user) return;
  if(!SYNC.ready){
    if(SYNC.choice){ SYNC.choice = L.map; return; }
    if(L.fromCache && !knownDevice()) return;   /* wait for the server's answer */
    return firstSync(L.map, !L.fromCache);
  }
  mergeFromCloud(L.map, !L.fromCache);
}
function releaseHold(){
  SYNC.hold = false;
  if(SYNC.deferred){ SYNC.deferred = false; processLatest(); }
}

function goLive(){
  SYNC.ready = true; SYNC.choice = null;
  lsSet(SYNC_FLAG, SYNC.user.uid);
  setSync(navigator.onLine === false ? "offline" : "synced");
}
function backupLocal(){
  var txt = JSON.stringify(S);
  lsSet(KEY + "_before_sync", txt); idbPut(KEY + "_before_sync", txt);
}
function firstSync(map, fromServer){
  if(!Object.keys(map).length){
    if(!fromServer) return;
    SYNC.cloud = {}; goLive(); pushNow(); render(); return;   /* first device: upload */
  }
  var R = assemble(map);
  if(knownDevice() || isEmptyState(S) || sameRecords(normalize(R.st), S)){
    goLive(); mergeFromCloud(map, fromServer); render(); return;
  }

}
/* "use this device's copy": everything here becomes newest, everything else is deleted */
function claimLocal(map){
  var R = assemble(map), t = Date.now(), mine = recMap(S), k;
  for(k in mine) M.m[k] = t;
  Object.keys(recMap(R.st)).forEach(function(key){ if(!(key in mine)){ M.gone[key] = t; delete M.m[key]; } });
  SYNC.cloud = Object.assign({}, map);

}
function takeCloud(map){
  var R = assemble(map);

  SYNC.cloud = Object.assign({}, map);
}

function onAuth(user){
  if(SYNC.unsub){ try{ SYNC.unsub(); }catch(e){} SYNC.unsub = null; }
  SYNC.user = user || null; SYNC.ready = false; SYNC.cloud = {}; SYNC.latest = null;
  SYNC.choice = null; SYNC.deferred = false;
  if(!user){ setSync("signedout"); render(); return; }
  setSync("connecting"); render();

    {includeMetadataChanges:true}, onChunks,

}

function errText(e){

    "auth/wrong-password":"Email or password is wrong.",
    "auth/user-not-found":"No account with that email yet — tap Create account.",

    auth, db,
    onAuthStateChanged: authM.onAuthStateChanged,
    signIn: authM.signInWithEmailAndPassword,
    signUp: authM.createUserWithEmailAndPassword,
    reset: authM.sendPasswordResetEmail,
    signOut: authM.signOut,
    collection: fsM.collection, doc: fsM.doc, writeBatch: fsM.writeBatch,
    onSnapshot: fsM.onSnapshot, serverTimestamp: fsM.serverTimestamp
  };
  window.dispatchEvent(new Event("fb-ready"));
}catch(e){
  window.FB_FAILED = true;
  window.dispatchEvent(new Event("fb-failed"));
}
</script>
</body>
