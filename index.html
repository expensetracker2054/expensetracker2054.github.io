<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#16181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Spend">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Daily Spend</title>
<style>
:root{
  --paper:#EDEEF1;
  --card:#FFFFFF;
  --ink:#16181D;
  --ink-2:#232630;
  --muted:#6F7681;
  --faint:#A4AAB4;
  --rule:#E1E4E8;
  --blue:#1F4B99;
  --green:#2A6B57;
  --ochre:#8A6A1F;
  --crimson:#A32B33;
  --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:520px;margin:0 auto;padding:0 var(--pad)}

header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.cycle{font-size:15px;color:var(--muted)}
.cycle b{color:var(--ink);font-weight:600}
.gear{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--muted);background:rgba(255,255,255,.7)}
.gear:active{background:#DFE2E6}

/* hero — the one dark surface on the screen */
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:22px 20px 18px;
  box-shadow:0 8px 24px -12px rgba(22,24,29,.55)}
.hero .lab{font-size:13.5px;color:rgba(255,255,255,.62)}
.big{font-size:54px;line-height:1;font-weight:660;letter-spacing:-.04em;margin:8px 0 4px}
.big.over{color:#FF8F8A}
.big.tight{color:#F0C25E}
.sub{font-size:13.5px;color:rgba(255,255,255,.62)}
.sub b{color:#fff;font-weight:600}
.strip{display:flex;align-items:flex-end;gap:2px;height:44px;margin:20px 0 7px}
.bar{flex:1;min-width:0;border-radius:2px;background:rgba(255,255,255,.20);height:2px}
.bar.on{background:rgba(255,255,255,.85)}
.bar.over{background:#FF8F8A}
.bar.today{box-shadow:0 6px 0 -4px #fff}
.bar.wk{margin-left:5px}
.striplab{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(255,255,255,.45)}

/* summary pills */
.pills{display:flex;gap:9px;margin-top:12px}
.pill{flex:1;background:var(--card);border-radius:14px;padding:12px 13px}
.pill .pt{font-size:12px;color:var(--muted)}
.pill .pv{font-size:18px;font-weight:640;letter-spacing:-.02em;margin-top:1px}
.pill .pv.neg{color:var(--crimson)}
.pill .pv.pos{color:var(--green)}
.rail{height:3px;background:var(--rule);border-radius:2px;margin-top:9px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--blue)}
.rail i.warn{background:var(--ochre)} .rail i.bad{background:var(--crimson)} .rail i.save{background:var(--green)}

/* section heading */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;padding:0 2px}
.sec h2{font-size:16px;font-weight:640;margin:0;letter-spacing:-.01em}
.sec span{font-size:13px;color:var(--muted)}

/* quick-add grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border-radius:15px;padding:11px 5px 9px;display:flex;flex-direction:column;
  align-items:center;gap:6px;transition:transform .1s}
.tile:active{transform:scale(.94)}
.ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px}
.tile .tn{font-size:11.5px;line-height:1.18;text-align:center;color:var(--ink);
  height:27px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;width:100%}
.tile .tn span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tv{font-size:11px;color:var(--muted);line-height:1;height:11px}
.tile.add .ic{background:var(--rule);color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:20px;margin:28px 0 2px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:20;background:var(--paper);padding-top:10px}
.tab{padding:0 0 10px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}

/* lists */
.daygroup{margin-top:18px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);padding:0 4px 8px}
.rows{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row:active{background:#F5F7F8}
.row .ic{width:36px;height:36px;border-radius:11px}
.row .ic svg{width:18px;height:18px}
.rname{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rname .n{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname .c{font-size:12.5px;color:var(--muted)}
.ramt{font-size:15.5px;font-weight:580;letter-spacing:-.01em}
.ramt.in{color:var(--green)}
.ramt.owe{color:var(--crimson)}
.ramt.mv{color:var(--muted);font-weight:520}
.empty{background:var(--card);border-radius:16px;padding:28px 22px;text-align:center;color:var(--muted);font-size:14.5px;margin-top:18px}
.empty b{display:block;color:var(--ink);font-weight:640;font-size:15.5px;margin-bottom:5px}

/* donut */
.donut{background:var(--card);border-radius:16px;padding:18px 16px 8px;margin-top:18px}
.dwrap{display:flex;align-items:center;gap:18px}
.dsvg{flex:none}
.dcen{font-size:11.5px;fill:var(--muted)}
.dtot{font-size:17px;font-weight:660;fill:var(--ink)}
.dleg{flex:1;min-width:0}
.lg{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13.5px}
.lg .sw{width:9px;height:9px;border-radius:3px;flex:none}
.lg .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .lv{color:var(--muted);font-size:12.5px}
.catlist{border-top:1px solid var(--rule);margin-top:12px}
.cat{padding:11px 0;border-top:1px solid var(--rule)}
.cat:first-child{border-top:0}
.cat .top{display:flex;justify-content:space-between;font-size:14.5px}
.cat .top span:last-child{font-weight:580}
.cbar{height:3px;background:var(--rule);border-radius:2px;margin-top:8px;overflow:hidden}
.cbar i{display:block;height:100%}
.pct{font-size:12.5px;color:var(--muted);margin-left:8px}

/* account card */
.acct{background:var(--card);border-radius:18px;padding:18px 18px 16px;margin-top:18px}
.acct .ah{display:flex;justify-content:space-between;align-items:baseline}
.acct .an{font-size:15.5px;font-weight:620}
.acct .av{font-size:26px;font-weight:660;letter-spacing:-.03em}
.acct .av.neg{color:var(--crimson)}
.acct .as{font-size:13px;color:var(--muted);margin-top:4px}
.gact{display:flex;gap:8px;margin-top:14px}
.mini{border:1px solid var(--rule);border-radius:10px;padding:8px 13px;font-size:13.5px}
.mini:active{background:#F1F3F5}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:0 2px}
.nav .lbl{font-size:14.5px;font-weight:600}
.nav button{width:36px;height:36px;border-radius:11px;border:1px solid var(--rule);background:var(--card);font-size:16px}
.nav button[disabled]{opacity:.35}

/* add bar */
.addbar{position:fixed;left:0;right:0;bottom:0;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--paper) 62%,rgba(237,238,241,0));pointer-events:none;z-index:40}
.addbar .inner{max-width:520px;margin:0 auto;pointer-events:auto}
.addbtn{width:100%;background:var(--ink);color:#fff;border-radius:15px;padding:16px;font-size:16px;font-weight:620;
  box-shadow:0 6px 18px -8px rgba(22,24,29,.7)}
.addbtn:active{background:var(--ink-2)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(16,18,22,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--paper);border-radius:22px 22px 0 0;
  transform:translateY(102%);transition:transform .22s cubic-bezier(.3,.85,.35,1);max-height:93vh;overflow:auto;
  padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.sheet .inner{max-width:520px;margin:0 auto;padding:0 var(--pad)}
.grab{width:38px;height:4px;background:var(--rule);border-radius:2px;margin:10px auto 4px}
.sh{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px}
.sh h2{font-size:17.5px;font-weight:640;margin:0}
.x{color:var(--muted);font-size:15px;padding:6px}

/* amount pad */
.amt{background:var(--card);border-radius:18px;padding:14px 16px 16px;text-align:center}
.amtcat{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:5px 13px 5px 5px;font-size:13.5px}
.amtcat .ic{width:26px;height:26px;border-radius:9px}
.amtcat .ic svg{width:14px;height:14px}
.amtv{font-size:42px;font-weight:660;letter-spacing:-.035em;line-height:1.15;min-height:46px;margin-top:8px}
.amtv.z{color:var(--faint)}
.amtcur{font-size:13px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.key{background:var(--card);border-radius:13px;padding:13px 0;font-size:22px;font-weight:520;text-align:center}
.key:active{background:#E5E8EB}
.key.fn{font-size:16px;color:var(--muted)}
.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.pickgrid .tile[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px}

.field{background:var(--card);border-radius:14px;margin-top:12px;overflow:hidden}
.fr{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--rule)}
.fr:first-child{border-top:0}
.fr label{font-size:14.5px;color:var(--muted);flex:none;width:132px}
.fr input,.fr select{flex:1;min-width:0;border:0;background:none;font-size:15.5px;text-align:right;padding:0;outline:none}
.toggle{width:48px;height:29px;border-radius:16px;background:var(--rule);position:relative;flex:none;margin-left:auto;transition:background .14s}
.toggle i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:left .14s;box-shadow:0 1px 2px rgba(0,0,0,.22)}
.toggle[aria-pressed="true"]{background:var(--ochre)}
.toggle[aria-pressed="true"] i{left:22px}
.hint{font-size:12.5px;color:var(--muted);padding:9px 4px 0;line-height:1.45}
.err{font-size:13px;color:var(--crimson);padding:8px 4px 0}
.primary{width:100%;background:var(--ink);color:#fff;border-radius:14px;padding:16px;font-size:16px;font-weight:620;margin-top:16px}
.primary:active{background:var(--ink-2)}
.primary.ghost{background:none;color:var(--crimson);border:1px solid #E6D3D4;margin-top:9px}
.secondary{width:100%;background:var(--card);border-radius:14px;padding:14px;font-size:15.5px;margin-top:9px;border:1px solid var(--rule)}
.segkind{display:flex;background:#E3E6EA;border-radius:12px;padding:3px;margin-top:2px}
.segkind button{flex:1;padding:10px;font-size:14px;border-radius:10px;color:var(--muted)}
.segkind button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sw2{width:34px;height:34px;border-radius:11px}
.sw2[aria-pressed="true"]{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.banner{background:#FBEBEC;color:var(--crimson);border-radius:12px;padding:11px 13px;font-size:13.5px;margin-top:14px}
footer{text-align:center;font-size:12px;color:var(--faint);padding:28px 0 8px}
footer button{color:var(--blue);font-size:12px;text-decoration:underline}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--faint)}
.sdot.ok{background:var(--green)} .sdot.busy{background:var(--ochre)} .sdot.bad{background:var(--crimson)}
.synccard{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.synccard .st{flex:1;min-width:0;font-size:13.5px;color:var(--muted);line-height:1.35}
.synccard .st b{display:block;color:var(--ink);font-size:14.5px;font-weight:620;margin-bottom:2px}
.synccard button{flex:none;background:var(--ink);color:#fff;border-radius:11px;padding:10px 14px;font-size:14px;font-weight:600}
.synccard.warn{background:#FBF3E4}
.linkbtn{display:block;width:100%;text-align:center;color:var(--muted);font-size:14px;padding:14px 0 4px}
.who{font-size:14.5px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px}
.who span:last-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp{display:flex;gap:9px;margin-top:4px}
.cmp div{flex:1;background:var(--card);border-radius:14px;padding:12px 13px;font-size:13px;color:var(--muted)}
.cmp div b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:3px}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:var(--ink);color:#fff;padding:11px 17px;border-radius:12px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:.18s}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="addbar"><div class="inner"><button class="addbtn" id="addBtn">Add expense</button></div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="inner" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){

var KEY = "spend_state_v1";

/* ---------- icons ---------- */
var ICONS = {

  rides:'<path d="M4.6 15l1.5-5.1a2.4 2.4 0 0 1 2.3-1.7h7.2a2.4 2.4 0 0 1 2.3 1.7L19.4 15"/><rect x="3.2" y="15" width="17.6" height="4" rx="1.6"/><path d="M6.4 19v1.6M17.6 19v1.6"/>',
  games:'<rect x="2.6" y="7.4" width="18.8" height="9.2" rx="4.2"/><path d="M7.4 10.6v3.2M5.8 12.2h3.2"/><circle cx="16.2" cy="11.4" r="1"/><circle cx="18.2" cy="13.6" r="1"/>'
};
var PALETTE = ["#2A6B57","#B4432F","#1F4B99","#7A4A8C","#8A6A1F","#3C6E8F",
               "#4B5D8A","#A32B33","#5B6570","#16705E","#8A3B5E","#737A85"];

var BASE_CATS = [
  {id:"groceries",   name:"Food for cooking", color:"#2A6B57", icon:"groceries"},
  {id:"dining",      name:"Dining out",       color:"#B4432F", icon:"dining"},
  {id:"household",   name:"Household",        color:"#6B7A5A", icon:"household"},
  {id:"furniture",   name:"Room & furniture", color:"#8A6A1F", icon:"furniture"},
  {id:"rides",       name:"Uber & Lyft",      color:"#146C7A", icon:"rides"},
  {id:"transit",     name:"Transit",          color:"#3C6E8F", icon:"transit"},

  {id:"school",      name:"School",           color:"#3F6B8A", icon:"school"},
  {id:"health",      name:"Health",           color:"#A32B33", icon:"health"},
  {id:"investing",   name:"Investing",        color:"#16705E", icon:"investing"},

];
/* ids used by the first build, mapped onto the new set */
var LEGACY = {food:"dining", grocery:"groceries", home:"furniture", fun:"social"};

var KINDS = {
  bank:   {label:"Bank",        icon:"bank",      color:"#1F4B99"},
  credit: {label:"Credit card", icon:"card",      color:"#8A3B5E"},
  invest: {label:"Investing",   icon:"investing", color:"#16705E"},
  person: {label:"Owed to me",  icon:"social",    color:"#B07A2E"}
};
var CURRENCIES = {CAD:"$", USD:"$", THB:"฿", MMK:"K", EUR:"€", GBP:"£", SGD:"$"};
var DEFAULT = {
  settings:{ currency:"CAD", allowance:0, startDay:1, savingsTarget:0,
             autoDeposit:true, depositAcct:"", defaultAcct:"", netTarget:0 },
  cats: BASE_CATS.slice(),
  accounts:[], bills:[], expenses:[], deposits:[], transfers:[]
};

var S = null, VIEW = "today", MOFF = 0, storageOK = true, loaded = false;
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------- storage: localStorage + IndexedDB mirror ---------- */
var idb = null;
function openIDB(){
  return new Promise(function(res){
    try{
      var r = indexedDB.open("daily_spend", 1);
      r.onupgradeneeded = function(e){ e.target.result.createObjectStore("kv"); };
      r.onsuccess = function(e){ idb = e.target.result; res(true); };
      r.onerror = function(){ res(false); };
      setTimeout(function(){ res(false); }, 2500);
    }catch(e){ res(false); }
  });
}
function idbPut(k,v){ if(!idb) return; try{ idb.transaction("kv","readwrite").objectStore("kv").put(v,k); }catch(e){} }
function idbGet(k){
  return new Promise(function(res){
    if(!idb) return res(null);
    try{
      var r = idb.transaction("kv","readonly").objectStore("kv").get(k);
      r.onsuccess = function(){ res(r.result || null); };
      r.onerror = function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function save(){
  if(!loaded) return;
  var txt = JSON.stringify(S);
  try{ localStorage.setItem(KEY, txt); storageOK = true; }catch(e){ storageOK = false; }
  idbPut(KEY, txt);
  idbPut("snap_" + todayISO(), txt);
  cloudAfterSave();
}
function load(){
  return openIDB().then(function(){
    var ls = null;
    try{ ls = localStorage.getItem(KEY); }catch(e){ storageOK = false; }
    return idbGet(KEY).then(function(ib){
      var raw = ls || ib;
      if(!raw){ S = clone(DEFAULT); return; }
      try{ S = normalize(JSON.parse(raw)); }catch(e){ S = clone(DEFAULT); }
      if(!ls && ib){ try{ localStorage.setItem(KEY, ib); }catch(e){} }
      if(ls && !ib){ idbPut(KEY, ls); }
    });
  });
}
function normalize(o){
  var d = clone(DEFAULT);
  if(!o || typeof o !== "object") return d;
  d.settings = Object.assign(d.settings, o.settings || {});
  d.cats = (Array.isArray(o.cats) && o.cats.length) ? o.cats : BASE_CATS.slice();
  d.bills = Array.isArray(o.bills) ? o.bills : [];
  d.expenses = Array.isArray(o.expenses) ? o.expenses : [];
  d.expenses.forEach(function(e){ if(LEGACY[e.cat]) e.cat = LEGACY[e.cat]; });
  d.deposits = Array.isArray(o.deposits) ? o.deposits
    : (Array.isArray(o.moves) ? o.moves.map(function(m){
        return {id:m.id, date:m.date, amt:m.amt, note:"", auto:false}; }) : []);
  d.transfers = Array.isArray(o.transfers) ? o.transfers : [];

  d.accounts = Array.isArray(o.accounts) ? o.accounts : [];
  /* builds before accounts existed kept one balance in settings */
  var old = o.settings || {};
  if(!d.accounts.length && old.openingDate){
    d.accounts = [{id:"acct_main", name:"Savings", kind:"bank",
      opening:+old.openingBalance || 0, openingDate:old.openingDate,
      color:KINDS.bank.color, target:+old.targetBalance || 0}];
    d.settings.netTarget = +old.targetBalance || 0;
  }
  delete d.settings.openingBalance; delete d.settings.openingDate; delete d.settings.targetBalance;

  var first = d.accounts.length ? d.accounts[0].id : "";
  if(!d.settings.defaultAcct || !d.accounts.some(function(a){ return a.id === d.settings.defaultAcct; }))
    d.settings.defaultAcct = first;
  if(!d.settings.depositAcct || !d.accounts.some(function(a){ return a.id === d.settings.depositAcct; }))
    d.settings.depositAcct = firstOfKind(d.accounts, "bank") || first;
  d.expenses.forEach(function(e){ if(!e.acct) e.acct = d.settings.defaultAcct; });
  d.deposits.forEach(function(x){ if(!x.acct) x.acct = d.settings.depositAcct; });
  return d;
}
function firstOfKind(list, kind){
  for(var i=0;i<list.length;i++) if(list[i].kind === kind) return list[i].id;
  return "";
}
function acctOf(id){
  for(var i=0;i<S.accounts.length;i++) if(S.accounts[i].id === id) return S.accounts[i];
  return null;
}
function acctIcon(a){
  return {name:a.name, color:a.color || KINDS[a.kind].color, icon:KINDS[a.kind].icon};
}

/* ---------- dates ---------- */
function pad2(n){ return n < 10 ? "0" + n : "" + n; }
function iso(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function todayISO(){ return iso(new Date()); }
function fromISO(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function addMonths(d,n){
  var y = d.getFullYear(), m = d.getMonth()+n, day = d.getDate();
  var last = new Date(y, m+1, 0).getDate();
  return new Date(y, m, Math.min(day,last));
}
function dayDiff(a,b){ return Math.round((b - a) / 86400000); }
function cycle(now, off){
  var s = Math.max(1, Math.min(28, S.settings.startDay|0 || 1));
  var start;
  if(now.getDate() >= s) start = new Date(now.getFullYear(), now.getMonth(), s);
  else start = new Date(now.getFullYear(), now.getMonth()-1, s);
  if(off) start = addMonths(start, off);
  var end = addDays(addMonths(start,1), -1);
  return {start:start, end:end, days: dayDiff(start,end)+1};
}
var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function shortDate(d){ return MON[d.getMonth()] + " " + d.getDate(); }
function dayLabel(s){
  if(s === todayISO()) return "Today";
  if(s === iso(addDays(new Date(),-1))) return "Yesterday";
  var d = fromISO(s);
  return DOW[d.getDay()] + ", " + shortDate(d);
}

/* ---------- money ---------- */
function sym(){ return CURRENCIES[S.settings.currency] || "$"; }
function fmt(n, decimals){
  var neg = n < 0; n = Math.abs(n);
  var dec = decimals === undefined ? (n >= 10000 ? 0 : 2) : decimals;
  var s = n.toFixed(dec).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + sym() + s;
}
function fmtShort(n){
  var a = Math.abs(n);
  if(a >= 1000) return sym() + (n/1000).toFixed(a >= 10000 ? 0 : 1) + "k";
  return sym() + Math.round(n);
}

/* ---------- derived ---------- */
function inCycle(s, c){ var d = fromISO(s); return d >= c.start && d <= c.end; }
function compute(off){
  var now = new Date(), c = cycle(now, off || 0), t = todayISO(), st = S.settings;
  var billsReserve = S.bills.reduce(function(a,b){ return a + (+b.amt || 0); }, 0);
  var pool = Math.max(0, (+st.allowance||0) - billsReserve - (+st.savingsTarget||0));

  var spentDaily = 0, spentBills = 0, spentToday = 0, byCat = {}, byDay = {};
  S.expenses.forEach(function(e){
    if(!inCycle(e.date, c)) return;
    var a = +e.amt || 0;
    byCat[e.cat] = (byCat[e.cat] || 0) + a;
    if(e.bill){ spentBills += a; }
    else{
      spentDaily += a;
      byDay[e.date] = (byDay[e.date] || 0) + a;
      if(e.date === t) spentToday += a;
    }
  });

  var todayD = fromISO(t);
  var daysLeft = Math.max(1, dayDiff(todayD, c.end) + 1);
  var poolBeforeToday = pool - (spentDaily - spentToday);
  var dry = poolBeforeToday <= 0;
  var todayBudget = dry ? 0 : poolBeforeToday / daysLeft;
  var leftToday = todayBudget - spentToday;

  /* one running balance per account: opening, plus money in and transfers in,
     minus expenses charged to it and transfers out. A credit card just runs
     negative — that negative number is what you owe. */
  var bal = {}, cash = 0, owed = 0, invested = 0, receivable = 0;
  S.accounts.forEach(function(a){
    var from = a.openingDate || "0000-01-01", b = +a.opening || 0;
    S.expenses.forEach(function(e){ if(e.acct === a.id && e.date >= from) b -= (+e.amt||0); });
    S.deposits.forEach(function(x){ if(x.acct === a.id && x.date >= from) b += (+x.amt||0); });
    S.transfers.forEach(function(t){
      if(t.date < from) return;
      if(t.from === a.id) b -= (+t.amt||0);
      if(t.to === a.id)   b += (+t.amt||0);
    });
    b = Math.round(b * 100) / 100;
    bal[a.id] = b;
    if(a.kind === "credit") owed += Math.max(0, -b);
    else if(a.kind === "invest") invested += b;
    else if(a.kind === "person") receivable += b;
    else cash += b;
  });
  var balance = cash + invested + receivable - owed;

  return {
    cycle:c, today:t, pool:pool, poolLeft: pool - spentDaily, billsReserve:billsReserve,
    spentDaily:spentDaily, spentBills:spentBills, spentToday:spentToday,
    daysLeft:daysLeft, todayBudget:todayBudget, leftToday:leftToday, dry:dry,
    byCat:byCat, byDay:byDay, balance:balance,
    bal:bal, cash:cash, owed:owed, invested:invested, receivable:receivable,
    inCycleDeposits: S.deposits.reduce(function(a,d){ return inCycle(d.date,c) ? a + (+d.amt||0) : a; }, 0),
    outCycle: spentDaily + spentBills,
    targetBalance:+st.netTarget || 0
  };
}

/* ---------- render helpers ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }
function catOf(id){
  for(var i=0;i<S.cats.length;i++) if(S.cats[i].id === id) return S.cats[i];
  return {id:"other", name:"Other", color:"#737A85", icon:"other"};
}
function iconBox(cat, cls){
  var g = ICONS[cat.icon] || ICONS.other;
  return '<span class="ic ' + (cls||"") + '" style="background:' + cat.color + '1A;color:' + cat.color + '">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
    g + '</svg></span>';
}

function render(){
  var m = compute();
  var setupNeeded = !S.settings.allowance;
  document.getElementById("app").innerHTML =
    header(m) + syncBanner() +
    (setupNeeded ? setupCard() : hero(m) + pills(m) + quickAdd(m)) +
    tabs() +
    (VIEW === "today" ? todayView(m) : VIEW === "month" ? monthView() : savingsView(m)) +
    (storageOK ? "" : '<div class="banner">This browser is blocking local storage, so nothing will be kept after you close the tab. Turn off private browsing to fix it.</div>') +
    '<footer id="syncFoot">' + syncFootHTML() + '</footer>';
  bind();
}

function header(m){
  return '<header><div class="cycle"><b>' + shortDate(m.cycle.start) + ' – ' + shortDate(m.cycle.end) + '</b>' +
    (S.settings.allowance ? ' · ' + m.daysLeft + (m.daysLeft === 1 ? ' day left' : ' days left') : '') + '</div>' +
    '<button class="gear" id="gearBtn" aria-label="Settings">' +
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="12" cy="12" r="3.2"/><path d="M19.9 15.4a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2a2 2 0 1 1-4 0V21a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.1 1z"/></svg></button></header>';
}

function setupCard(){
  return '<div class="hero"><div class="lab">Nothing set up yet</div>' +
    '<div style="font-size:27px;font-weight:640;letter-spacing:-.03em;line-height:1.2;margin:10px 0 8px">' +
    'Start with your monthly amount</div>' +
    '<div class="sub">Your monthly money, minus fixed bills and anything you keep back, becomes a daily number. ' +
    'Every expense is logged against the account or card that paid for it.</div>' +
    '<button class="primary" id="setupBtn" style="background:#fff;color:var(--ink)">Set up the month</button></div>';
}

function hero(m){
  var cls = (m.leftToday < 0 || m.dry) ? "over" : (m.leftToday < m.todayBudget * 0.25 ? "tight" : "");
  var lab, big, line;
  if(m.dry){
    lab = "Nothing left for today"; big = fmt(0);
    line = 'This month\u2019s spending money is gone \u2014 you are <b>' + fmt(-m.poolLeft) +
      '</b> past it with ' + m.daysLeft + (m.daysLeft === 1 ? ' day' : ' days') + ' to go.';
  }else if(m.leftToday < 0){
    lab = "Over today by"; big = fmt(-m.leftToday);
    line = 'Today\u2019s share was <b>' + fmt(m.todayBudget) + '</b>. Tomorrow shrinks to cover the difference.';
  }else{
    lab = "Left to spend today"; big = fmt(m.leftToday);
    line = '<b>' + fmt(m.spentToday) + '</b> spent today of ' + fmt(m.todayBudget);
  }
  return '<div class="hero"><div class="lab">' + lab + '</div>' +
    '<div class="big num ' + cls + '">' + big + '</div>' +
    '<div class="sub">' + line + '</div>' + strip(m) + '</div>';
}

function strip(m){
  var base = m.pool / m.cycle.days, max = base;
  for(var k in m.byDay) if(m.byDay[k] > max) max = m.byDay[k];
  if(max <= 0) max = 1;
  var out = '<div class="strip">';
  for(var i=0;i<m.cycle.days;i++){
    var d = addDays(m.cycle.start, i), key = iso(d), v = m.byDay[key] || 0;
    var h = v > 0 ? Math.max(4, Math.round(Math.min(1, v / max) * 42)) : 2;
    var cls = (v > 0 ? (v > base ? "over " : "on ") : "") + (key === m.today ? "today " : "") +
              (d.getDay() === 0 && i > 0 ? "wk" : "");
    out += '<div class="bar ' + cls + '" style="height:' + h + 'px"></div>';
  }
  return out + '</div><div class="striplab"><span>' + shortDate(m.cycle.start) + '</span>' +
    '<span>' + fmt(base, 0) + ' a day</span><span>' + shortDate(m.cycle.end) + '</span></div>';
}

function pills(m){
  var neg = m.poolLeft < 0;
  var poolPct = neg ? 100 : (m.pool > 0 ? Math.min(100, Math.max(0, m.poolLeft / m.pool * 100)) : 0);
  var poolCls = neg || poolPct < 12 ? "bad" : poolPct < 30 ? "warn" : "";
  var savePct = m.targetBalance > 0 ? Math.min(100, Math.max(0, m.balance / m.targetBalance * 100)) : (m.balance > 0 ? 100 : 0);
  var out = '<div class="pills">';
  out += '<div class="pill"><div class="pt">' + (neg ? "Over this month" : "Left this month") + '</div>' +
    '<div class="pv num' + (neg ? " neg" : "") + '">' + fmt(Math.abs(m.poolLeft)) + '</div>' +
    '<div class="rail"><i class="' + poolCls + '" style="width:' + poolPct + '%"></i></div></div>';
  if(m.billsReserve > 0){
    var bp = Math.min(100, m.spentBills / m.billsReserve * 100);
    out += '<div class="pill"><div class="pt">Bills paid</div><div class="pv num">' + fmt(m.spentBills) + '</div>' +
      '<div class="rail"><i style="width:' + bp + '%"></i></div></div>';
  }
  if(S.accounts.length){
    var mixed = S.accounts.some(function(a){ return a.kind !== "bank"; });
    out += '<div class="pill"><div class="pt">' + (mixed ? "Net worth" : "In the bank") + '</div>' +
      '<div class="pv num' + (m.balance < 0 ? " neg" : "") + '">' + fmt(m.balance) + '</div>' +
      '<div class="rail"><i class="' + (m.balance < 0 ? "bad" : "save") + '" style="width:' + savePct + '%"></i></div></div>';
  }
  return out + '</div>';
}

function quickAdd(m){
  var out = '<div class="sec"><h2>Log an expense</h2><span>this cycle</span></div><div class="grid">';
  S.cats.forEach(function(c){
    var v = m.byCat[c.id] || 0;
    out += '<button class="tile" data-quick="' + c.id + '">' + iconBox(c) +
      '<span class="tn"><span>' + esc(c.name) + '</span></span>' +
      '<span class="tv num">' + (v > 0 ? fmtShort(v) : "\u2014") + '</span></button>';
  });
  out += '<button class="tile add" data-manage="1">' +
    '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">' +
    '<path d="M12 5v14M5 12h14"/></svg></span><span class="tn"><span>Add a type</span></span><span class="tv">&nbsp;</span></button>';
  return out + '</div>';
}

function tabs(){
  function t(id,l){ return '<button class="tab" data-view="' + id + '" aria-selected="' + (VIEW===id) + '">' + l + '</button>'; }
  return '<div class="tabs" role="tablist">' + t("today","Today") + t("month","This month") + t("savings","Accounts") + '</div>';

function rowHTML(e){
  var c = catOf(e.cat);
  return '<button class="row" data-edit="' + e.id + '">' + iconBox(c) +
    '<span class="rname"><span class="n">' + esc(e.note || c.name) + '</span>' +

    '<span class="ramt num">' + fmt(e.amt) + '</span></button>';
}

function todayView(m){
  var list = S.expenses.filter(function(e){ return e.date === m.today; }).sort(function(a,b){ return b.ts - a.ts; });
  if(!list.length){
    return '<div class="empty"><b>Nothing logged today</b>Tap a type above the moment you pay for something. ' +
      'Five seconds each time is the whole trick.</div>';
  }
  var tot = list.reduce(function(a,e){ return a + (+e.amt||0); }, 0);
  return '<div class="daygroup"><div class="dayhead"><span>Today</span><span class="num">' + fmt(tot) + '</span></div>' +
    '<div class="rows">' + list.map(rowHTML).join("") + '</div></div>';
}

function donut(items, total){
  var R = 52, C = 2 * Math.PI * R, off = 0;
  var segs = items.map(function(x){
    var len = total > 0 ? x.v / total * C : 0;
    var s = '<circle cx="64" cy="64" r="' + R + '" fill="none" stroke="' + x.c.color + '" stroke-width="17" ' +
      'stroke-dasharray="' + Math.max(0, len - 2) + ' ' + (C - Math.max(0, len - 2)) + '" ' +
      'stroke-dashoffset="' + (-off) + '" transform="rotate(-90 64 64)" stroke-linecap="butt"/>';
    off += len; return s;
  }).join("");
  return '<svg class="dsvg" width="128" height="128" viewBox="0 0 128 128">' +
    '<circle cx="64" cy="64" r="' + R + '" fill="none" stroke="#EDEEF1" stroke-width="17"/>' + segs +
    '<text class="dtot" x="64" y="62" text-anchor="middle">' + fmtShort(total) + '</text>' +
    '<text class="dcen" x="64" y="78" text-anchor="middle">spent</text></svg>';
}

function monthView(){
  var m = compute(MOFF);
  var out = '<div class="nav"><button id="prevCyc" aria-label="Earlier month">&lsaquo;</button>' +
    '<span class="lbl">' + shortDate(m.cycle.start) + ' – ' + shortDate(m.cycle.end) +
    (MOFF === 0 ? '' : ' · ' + m.cycle.start.getFullYear()) + '</span>' +
    '<button id="nextCyc" aria-label="Later month"' + (MOFF >= 0 ? ' disabled' : '') + '>&rsaquo;</button></div>' +
    '<button class="primary" id="dlImg" style="margin-top:12px">\u4fdd\u5b58\u672c\u671f\u62a5\u8868\u56fe\u7247\uff08\u53ef\u53d1\u5fae\u4fe1\uff09</button>' +
    '<button class="secondary" id="dlStmt">\u7f51\u9875\u7248\u62a5\u8868\uff08\u53ef\u6253\u5370\u6210 PDF\uff09</button>';

  var items = S.cats.map(function(c){ return {c:c, v:m.byCat[c.id] || 0}; })
    .filter(function(x){ return x.v > 0; }).sort(function(a,b){ return b.v - a.v; });
  var total = items.reduce(function(a,x){ return a + x.v; }, 0);

  if(items.length){
    out += '<div class="donut"><div class="dwrap">' + donut(items, total) + '<div class="dleg">' +
      items.slice(0,5).map(function(x){
        return '<div class="lg"><span class="sw" style="background:' + x.c.color + '"></span>' +
          '<span class="ln">' + esc(x.c.name) + '</span>' +
          '<span class="lv num">' + Math.round(x.v/total*100) + '%</span></div>';
      }).join("") +
      (items.length > 5 ? '<div class="lg"><span class="sw" style="background:var(--rule)"></span>' +
        '<span class="ln">' + (items.length - 5) + ' more</span></div>' : '') +
      '</div></div><div class="catlist">' +
      items.map(function(x){
        return '<div class="cat"><div class="top"><span>' + esc(x.c.name) +
          '<span class="pct num">' + Math.round(x.v/total*100) + '%</span></span>' +
          '<span class="num">' + fmt(x.v) + '</span></div>' +
          '<div class="cbar"><i style="width:' + (x.v/items[0].v*100) + '%;background:' + x.c.color + '"></i></div></div>';
      }).join("") + '</div></div>';
  }

  var inC = S.expenses.filter(function(e){ return inCycle(e.date, m.cycle); });
  if(!inC.length){
    return out + '<div class="empty"><b>Nothing here</b>' +
      (MOFF === 0 ? 'Once you log a few days, this is where the pattern shows up.' : 'No spending was logged in this stretch.') + '</div>';
  }
  var days = {};
  inC.forEach(function(e){ (days[e.date] = days[e.date] || []).push(e); });
  Object.keys(days).sort().reverse().forEach(function(k){
    var rows = days[k].sort(function(a,b){ return b.ts - a.ts; });
    var tot = rows.reduce(function(a,e){ return a + (+e.amt||0); }, 0);
    out += '<div class="daygroup"><div class="dayhead"><span>' + dayLabel(k) + '</span>' +
      '<span class="num">' + fmt(tot) + '</span></div><div class="rows">' + rows.map(rowHTML).join("") + '</div></div>';
  });
  return out;
}

function savingsView(m){
  if(!S.accounts.length){
    return '<div class="empty"><b>Add your accounts</b>Set up the accounts you actually use — each bank, your credit card, ' +
      'your investing account. Then every expense is logged against the one that paid for it.</div>' +
      '<button class="secondary" id="newAcct">Add an account</button>';
  }

  var target = m.targetBalance;
  var pct = target > 0 ? Math.min(100, Math.max(0, m.balance / target * 100)) : 0;
  var mixed = S.accounts.some(function(a){ return a.kind !== "bank"; });
  var out = '<div class="acct"><div class="ah"><span class="an">' + (mixed ? 'Net worth' : 'Across your accounts') + '</span>' +
    '<span class="av num' + (m.balance < 0 ? ' neg' : '') + '">' + fmt(m.balance) + '</span></div>' +
    '<div class="as">' + (m.owed > 0.005
      ? fmt(m.cash) + ' in the bank' + (m.invested ? ', ' + fmt(m.invested) + ' invested' : '') +
        (m.receivable ? ', ' + fmt(m.receivable) + ' owed to you' : '') + ', ' + fmt(m.owed) + ' owed on cards'
      : (target > 0 ? (m.balance >= target ? fmt(m.balance - target) + ' above your ' + fmt(target) + ' target'
                                           : fmt(target - m.balance) + ' below your ' + fmt(target) + ' target')
                    : fmt(m.cash) + ' in cash' + (m.invested ? ', ' + fmt(m.invested) + ' invested' : '') +
                      (m.receivable ? ', ' + fmt(m.receivable) + ' owed to you' : ''))) + '</div>' +
    (target > 0 ? '<div class="rail"><i class="' + (m.balance < 0 ? 'bad' : 'save') + '" style="width:' + pct + '%"></i></div>' : '') +
    '<div class="gact"><button class="mini" id="addDep">Money in</button>' +
    '<button class="mini" id="moveBtn">Move money</button>' +
    '<button class="mini" id="newAcct">Add account</button></div></div>';

  var money = S.accounts.filter(function(a){ return a.kind !== "person"; });
  var people = S.accounts.filter(function(a){ return a.kind === "person"; });
  function acctRows(list){ return '<div class="rows">' + list.map(function(a){
      var b = m.bal[a.id] || 0, credit = a.kind === "credit";
      var val = credit ? Math.max(0, -b) : b;
      var sub = credit ? (val > 0 ? "owed on this card" : "nothing owed")
               : a.kind === "person" ? (b > 0.005 ? "owes you" : "all settled")
               : KINDS[a.kind].label + (a.target > 0 ? " · target " + fmtShort(a.target) : "");
      return '<button class="row" data-acct="' + a.id + '">' + iconBox(acctIcon(a)) +
        '<span class="rname"><span class="n">' + esc(a.name) + '</span><span class="c">' + sub + '</span></span>' +
        '<span class="ramt num' + (credit && val > 0 ? ' owe' : (!credit && b < 0 ? ' owe' : '')) + '">' +
        (credit && val > 0 ? '-' : '') + fmt(val) + '</span></button>';
  }).join("") + '</div>'; }

  out += '<div class="sec" style="margin-top:24px"><h2>Accounts</h2><span>tap to open</span></div>' + acctRows(money);
  if(people.length){
    out += '<div class="sec" style="margin-top:24px"><h2>Owed to me</h2><span>' + fmt(m.receivable) + '</span></div>' +
      acctRows(people);
  }

  var payable = S.accounts.filter(function(a){ return a.kind === "credit" && (m.bal[a.id] || 0) < -0.004; });
  if(payable.length && S.accounts.some(function(a){ return a.kind !== "credit"; })){
    out += payable.map(function(a){
      return '<button class="secondary" data-payoff="' + a.id + '">Pay off ' + esc(a.name) +
        ' in full — ' + fmt(-m.bal[a.id]) + '</button>';
    }).join("");
  }

  out += ledger(null, 40);
  return out;
}

/* combined money-in / money-out / transfer list, newest first */
function ledger(acctId, limit){
  var items = [];
  S.deposits.forEach(function(d){
    if(acctId && d.acct !== acctId) return;
    items.push({date:d.date, id:d.id, kind:"in", amt:+d.amt||0,
      name:d.note || (d.auto ? "Monthly money" : "Paid in"),
      sub:(acctId ? "" : nameOf(d.acct))});
  });
  S.expenses.forEach(function(e){
    if(acctId && e.acct !== acctId) return;
    items.push({date:e.date, id:e.id, kind:"out", amt:+e.amt||0, cat:e.cat,
      name:e.note || catOf(e.cat).name,
      sub:(e.bill ? "Bill · " : "") + (acctId ? catOf(e.cat).name : nameOf(e.acct))});
  });
  S.transfers.forEach(function(t){
    if(acctId && t.from !== acctId && t.to !== acctId) return;
    var outward = acctId ? t.from === acctId : true;
    items.push({date:t.date, id:t.id, kind:"move", amt:+t.amt||0, outward:outward,
      name:t.note || "Transfer",
      sub:nameOf(t.from) + " \u2192 " + nameOf(t.to)});
  });
  items.sort(function(x,y){ return x.date < y.date ? 1 : x.date > y.date ? -1 : 0; });
  var more = items.length > limit;
  items = items.slice(0, limit);
  if(!items.length) return '<div class="empty"><b>No movement yet</b>Log an expense, record money coming in, or move some between accounts.</div>';

  var IN = {color:"#2A6B57", icon:"investing"}, MV = {color:"#5B6570", icon:"move"};
  return '<div class="daygroup"><div class="dayhead"><span>Money in and out</span>' +
    '<span>' + (more ? "latest " + limit : items.length) + '</span></div><div class="rows">' +
    items.map(function(it){
      var box = it.kind === "in" ? IN : it.kind === "move" ? MV : catOf(it.cat);
      var attr = it.kind === "in" ? ' data-dep="' + it.id + '"'
               : it.kind === "move" ? ' data-move="' + it.id + '"'
               : ' data-edit="' + it.id + '"';
      var sign = it.kind === "in" ? "+" : it.kind === "move" ? (it.outward ? "\u2192 " : "\u2190 ") : "-";
      return '<button class="row"' + attr + '>' + iconBox(box) +
        '<span class="rname"><span class="n">' + esc(it.name) + '</span>' +
        '<span class="c">' + dayLabel(it.date) + (it.sub ? " \u00b7 " + esc(it.sub) : "") + '</span></span>' +
        '<span class="ramt num' + (it.kind === "in" ? ' in' : it.kind === "move" ? ' mv' : '') + '">' +
        sign + fmt(it.amt) + '</span></button>';
    }).join("") + '</div></div>';
}
function nameOf(id){ var a = acctOf(id); return a ? a.name : "\u2014"; }

/* ---------- sheets ---------- */
var sheetEl = document.getElementById("sheet"),
    scrimEl = document.getElementById("scrim"),
    bodyEl  = document.getElementById("sheetBody");
function openSheet(title, html, after){
  SYNC.hold = true;
  bodyEl.innerHTML = '<div class="sh"><h2>' + esc(title) + '</h2><button class="x" id="closeSheet">Close</button></div>' + html;
  scrimEl.classList.add("on"); sheetEl.classList.add("on"); sheetEl.scrollTop = 0;
  document.getElementById("closeSheet").onclick = closeSheet;
  if(after) after();
}
function closeSheet(){
  scrimEl.classList.remove("on"); sheetEl.classList.remove("on");
  setTimeout(function(){ if(!sheetEl.classList.contains("on")) bodyEl.innerHTML = ""; }, 240);
  releaseHold();
}
scrimEl.onclick = closeSheet;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("on"); }, 1700);
}
function setErr(msg){ var e = document.getElementById("sheetErr"); if(e) e.textContent = msg || ""; }

/* --- expense --- */
var draft = null, picking = false;
function expenseSheet(existing, presetCat){
  draft = existing
    ? {id:existing.id, amt:String(existing.amt), cat:existing.cat, note:existing.note||"",
       date:existing.date, bill:!!existing.bill, acct:existing.acct, ts:existing.ts}
    : {id:null, amt:"", cat:presetCat || S.cats[0].id, note:"", date:todayISO(), bill:false,
       acct:S.settings.defaultAcct, ts:Date.now()};
  picking = false;

  var html =
    '<div class="amt"><button class="amtcat" id="catBtn"></button>' +
      '<div class="amtv num" id="amtV">0</div><div class="amtcur">' + S.settings.currency + '</div></div>' +
    '<div id="picker" style="display:none"><div class="pickgrid" id="pickGrid"></div></div>' +
    '<div class="pad" id="pad">' +
      ["1","2","3","4","5","6","7","8","9"].map(function(k){ return '<button class="key" data-k="' + k + '">' + k + '</button>'; }).join("") +
      '<button class="key" data-k=".">.</button><button class="key" data-k="0">0</button>' +
      '<button class="key fn" data-k="del">Delete</button></div>' +
    '<div class="field">' +
      (S.accounts.some(function(a){ return a.kind !== "person"; }) ? '<div class="fr"><label for="fAcct">Paid with</label><select id="fAcct">' +
        S.accounts.filter(function(a){ return a.kind !== "person"; }).map(function(a){
          return '<option value="' + a.id + '"' + (a.id === draft.acct ? " selected" : "") + '>' + esc(a.name) + '</option>';
        }).join("") + '</select></div>' : '') +
      '<div class="fr"><label for="fNote">Note</label><input id="fNote" placeholder="optional" value="' + esc(draft.note) + '"></div>' +
      '<div class="fr"><label for="fDate">Date</label><input id="fDate" type="date" value="' + draft.date + '"></div>' +
      '<div class="fr"><label>Fixed bill</label><button class="toggle" id="fBill" aria-pressed="' + draft.bill + '"><i></i></button></div>' +
    '</div>' +
    '<div class="hint">A fixed bill comes out of the money already reserved for bills, so it will not eat into today\u2019s number. It still leaves the account that paid it.</div>' +
    '<div class="err" id="sheetErr"></div>' +
    '<button class="primary" id="saveExp">' + (existing ? "Save changes" : "Add expense") + '</button>' +
    (existing ? '<button class="primary ghost" id="delExp">Delete this expense</button>' : "");

  openSheet(existing ? "Edit expense" : "New expense", html, function(){
    paintAmt(); paintCatBtn(); paintPicker();
    document.getElementById("catBtn").onclick = function(){
      picking = !picking;
      document.getElementById("picker").style.display = picking ? "block" : "none";
      document.getElementById("pad").style.display = picking ? "none" : "grid";
    };
    document.getElementById("pickGrid").onclick = function(ev){
      var b = ev.target.closest("[data-cat]"); if(!b) return;
      draft.cat = b.getAttribute("data-cat");
      picking = false;
      document.getElementById("picker").style.display = "none";
      document.getElementById("pad").style.display = "grid";
      paintCatBtn(); paintPicker();
    };
    document.getElementById("pad").onclick = function(ev){
      var b = ev.target.closest("[data-k]"); if(!b) return;
      var k = b.getAttribute("data-k");
      if(k === "del") draft.amt = draft.amt.slice(0,-1);
      else if(k === "."){ if(draft.amt.indexOf(".") < 0) draft.amt = (draft.amt || "0") + "."; }
      else{
        var dot = draft.amt.indexOf(".");
        if(dot >= 0 && draft.amt.length - dot > 2) return;
        if(draft.amt.replace(".","").length > 9) return;
        draft.amt += k;
      }
      paintAmt(); setErr("");
    };
    document.getElementById("fBill").onclick = function(){
      draft.bill = !draft.bill; this.setAttribute("aria-pressed", draft.bill);
    };
    var fa = document.getElementById("fAcct");
    if(fa) fa.onchange = function(){ draft.acct = this.value; };
    document.getElementById("fNote").oninput = function(){ draft.note = this.value; };
    document.getElementById("fDate").onchange = function(){ draft.date = this.value || todayISO(); };
    document.getElementById("saveExp").onclick = function(){
      var a = parseFloat(draft.amt);
      if(!(a > 0)) return setErr("Enter an amount above zero.");
      if(!draft.date) return setErr("Pick a date.");
      if(draft.id){
        S.expenses.forEach(function(e,i){
          if(e.id === draft.id) S.expenses[i] = {id:draft.id, amt:a, cat:draft.cat, acct:draft.acct,
            note:draft.note.trim(), date:draft.date, bill:draft.bill, ts:draft.ts};
        });
      }else{
        S.expenses.push({id:uid(), amt:a, cat:draft.cat, acct:draft.acct, note:draft.note.trim(),
          date:draft.date, bill:draft.bill, ts:Date.now()});
        S.settings.defaultAcct = draft.acct;
      }
      save(); closeSheet(); render(); toast(draft.id ? "Saved" : "Added " + fmt(a));
    };
    if(existing) document.getElementById("delExp").onclick = function(){
      S.expenses = S.expenses.filter(function(e){ return e.id !== draft.id; });
      save(); closeSheet(); render(); toast("Deleted");
    };
  });
}
function paintAmt(){
  var v = document.getElementById("amtV");
  v.textContent = draft.amt === "" ? "0" : draft.amt;
  v.classList.toggle("z", draft.amt === "");
}
function paintCatBtn(){
  var c = catOf(draft.cat);
  document.getElementById("catBtn").innerHTML = iconBox(c) + '<span>' + esc(c.name) + '</span>' +
    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
}
function paintPicker(){
  document.getElementById("pickGrid").innerHTML = S.cats.map(function(c){
    return '<button class="tile" data-cat="' + c.id + '" aria-pressed="' + (c.id === draft.cat) + '">' +
      iconBox(c) + '<span class="tn"><span>' + esc(c.name) + '</span></span></button>';
  }).join("");
}

/* --- categories --- */
var newCat = {name:"", color:PALETTE[0], icon:"other"};
function catsSheet(){
  newCat = {name:"", color:PALETTE[Math.floor(Math.random()*PALETTE.length)], icon:"other"};
  var html = '<div class="field" id="catRows"></div>' +
    '<div class="hint">Renaming a type updates it everywhere. Removing one leaves its past expenses filed under Other.</div>' +
    '<div style="margin-top:24px;font-size:15px;font-weight:600">Add a type</div>' +
    '<div class="field"><div class="fr"><label for="ncN">Name</label>' +
      '<input id="ncN" placeholder="Gifts" style="text-align:right"></div></div>' +

function paintCatRows(){
  document.getElementById("catRows").innerHTML = S.cats.map(function(c,i){
    return '<div class="fr">' + iconBox(c) +
      '<input class="cn" data-i="' + i + '" value="' + esc(c.name) + '" style="text-align:left">' +

  }).join("");

function readCatNames(){

function paintSwatches(){

      'style="background:' + c + '" aria-label="Colour"></button>';

/* --- accounts --- */
function acctSheet(existing){
  var isNew = !existing;
  var draftA = existing ? clone(existing)
    : {id:null, name:"", kind:"bank", opening:"", openingDate:todayISO(), color:KINDS.bank.color, target:0};
  var html =
    '<div class="segkind" id="kindRow">' + Object.keys(KINDS).map(function(k){
      return '<button data-kind="' + k + '" aria-pressed="' + (draftA.kind === k) + '">' + KINDS[k].label + '</button>';
    }).join("") + '</div>' +
    '<div class="field">' +
      '<div class="fr"><label for="nA">Name</label><input id="nA" value="' + esc(draftA.name) + '" placeholder="RBC chequing"></div>' +
      '<div class="fr"><label for="bA" id="bAlab">Balance now</label><input id="bA" type="number" inputmode="decimal" value="' + (draftA.opening === "" ? "" : draftA.opening) + '" placeholder="0"></div>' +
      '<div class="fr"><label for="dA">As of</label><input id="dA" type="date" value="' + (draftA.openingDate || todayISO()) + '"></div>' +
      '<div class="fr"><label for="tA">Target</label><input id="tA" type="number" inputmode="decimal" value="' + (draftA.target || "") + '" placeholder="optional"></div>' +
    '</div>' +
    '<div class="hint" id="aHint"></div>' +
    '<div class="err" id="sheetErr"></div>' +
    '<button class="primary" id="aSave">' + (isNew ? "Add account" : "Save account") + '</button>' +
    (isNew ? "" : '<button class="primary ghost" id="aDel">Remove this account</button>');

  openSheet(isNew ? "New account" : esc(draftA.name || "Account"), html, function(){
    paintKind();
    document.getElementById("kindRow").onclick = function(ev){
      var b = ev.target.closest("[data-kind]"); if(!b) return;
      draftA.kind = b.getAttribute("data-kind");
      if(!existing || !existing.color) draftA.color = KINDS[draftA.kind].color;
      paintKind();
    };
    document.getElementById("aSave").onclick = function(){
      var n = document.getElementById("nA").value.trim();
      var v = parseFloat(document.getElementById("bA").value);
      var d = document.getElementById("dA").value;
      if(!n) return setErr("Give the account a name.");
      if(isNaN(v)) return setErr("Enter the balance, even if it is zero.");
      if(!d) return setErr("Pick the date this balance is from.");
      if(draftA.kind === "credit" && v > 0) v = -v;   /* a card balance is money owed */
      if(draftA.kind === "person" && v < 0) v = -v;   /* a person's balance is money owed TO you */
      var rec = {name:n, kind:draftA.kind, opening:v, openingDate:d,
                 color:draftA.color, target:parseFloat(document.getElementById("tA").value) || 0};
      if(isNew){
        rec.id = uid(); S.accounts.push(rec);
        if(!S.settings.defaultAcct) S.settings.defaultAcct = rec.id;
        if(!S.settings.depositAcct && rec.kind === "bank") S.settings.depositAcct = rec.id;
      }else{
        S.accounts.forEach(function(x,i){ if(x.id === existing.id) S.accounts[i] = Object.assign(x, rec); });
      }
      syncAutoDeposits(); save(); closeSheet(); render(); toast(isNew ? "Added " + n : "Saved");
    };
    if(!isNew) document.getElementById("aDel").onclick = function(){
      var used = S.expenses.some(function(e){ return e.acct === existing.id; }) ||
                 S.deposits.some(function(x){ return x.acct === existing.id; }) ||
                 S.transfers.some(function(t){ return t.from === existing.id || t.to === existing.id; });
      if(used) return setErr("This account has entries against it. Move or delete those first.");
      S.accounts = S.accounts.filter(function(x){ return x.id !== existing.id; });
      if(S.settings.defaultAcct === existing.id) S.settings.defaultAcct = S.accounts.length ? S.accounts[0].id : "";
      if(S.settings.depositAcct === existing.id) S.settings.depositAcct = firstOfKind(S.accounts,"bank") || S.settings.defaultAcct;
      save(); closeSheet(); render(); toast("Account removed");
    };
    function paintKind(){
      bodyEl.querySelectorAll("[data-kind]").forEach(function(b){
        b.setAttribute("aria-pressed", b.getAttribute("data-kind") === draftA.kind);
      });
      var credit = draftA.kind === "credit", person = draftA.kind === "person";
      document.getElementById("bAlab").textContent = credit ? "Owed now" : person ? "They owe you" : "Balance now";
      document.getElementById("nA").placeholder = person ? "Ivan" : "RBC chequing";
      document.getElementById("aHint").textContent = credit
        ? "Enter what is on the card today. Expenses you charge to it add to that, and paying the card off is a transfer from a bank account, so the money only leaves your net worth once."
        : person
        ? "Money someone owes you counts towards your net worth. When they pay you back, use Move money from their name into the account that received it. If you front them something new, use Money in on their name."
        : "Type what your bank says today. Only money moved after this date changes it, so nothing is counted twice.";
    }
  });
}

function accountRowSheet(id){
  var a = acctOf(id); if(!a) return;
  var m = compute(), b = m.bal[id] || 0, credit = a.kind === "credit";
  var html = '<div class="acct" style="margin-top:0"><div class="ah">' +
      '<span class="an">' + (credit ? "Owed now" : "Balance") + '</span>' +
      '<span class="av num' + ((credit ? b < -0.004 : b < 0) ? ' neg' : '') + '">' +
      fmt(credit ? Math.max(0,-b) : b) + '</span></div>' +
      '<div class="as">' + KINDS[a.kind].label + ' · opened at ' + fmt(a.opening) +
      ' on ' + shortDate(fromISO(a.openingDate)) + '</div></div>' +
    '<button class="secondary" id="aEdit">Adjust this account</button>' +
    (credit && b < -0.004 ? '<button class="secondary" data-payoff="' + id + '">Pay it off in full — ' + fmt(-b) + '</button>' : '') +
    ledger(id, 40);
  openSheet(a.name, html, function(){
    document.getElementById("aEdit").onclick = function(){ acctSheet(a); };

    bodyEl.querySelectorAll("[data-payoff]").forEach(function(x){
      x.onclick = function(){ payoffSheet(x.getAttribute("data-payoff")); };
    });

}

function moveSheet(existing, preset){
  if(S.accounts.length < 2) return toast("Add a second account first");
  var opts = function(sel){
    return S.accounts.map(function(a){
      return '<option value="' + a.id + '"' + (a.id === sel ? " selected" : "") + '>' + esc(a.name) + '</option>';
    }).join("");
  };
  var f = existing ? existing.from : (preset ? preset.from : S.accounts[0].id);
  var t = existing ? existing.to   : (preset ? preset.to   : S.accounts[1].id);
  var html = '<div class="field">' +
      '<div class="fr"><label for="mA">Amount</label><input id="mA" type="number" inputmode="decimal" value="' +
        (existing ? existing.amt : (preset && preset.amt ? preset.amt.toFixed(2) : "")) + '" placeholder="0"></div>' +
      '<div class="fr"><label for="mF">From</label><select id="mF">' + opts(f) + '</select></div>' +
      '<div class="fr"><label for="mT">To</label><select id="mT">' + opts(t) + '</select></div>' +
      '<div class="fr"><label for="mN">Note</label><input id="mN" value="' + esc(existing ? existing.note : (preset ? preset.note : "")) + '" placeholder="optional"></div>' +
      '<div class="fr"><label for="mD">Date</label><input id="mD" type="date" value="' + (existing ? existing.date : todayISO()) + '"></div>' +
    '</div>' +
    '<div class="hint">A transfer moves money between your own accounts. It is not spending, so it never touches your daily number — use it to pay off a card or top up your investing account.</div>' +
    '<div class="err" id="sheetErr"></div>' +
    '<button class="primary" id="mSave">' + (existing ? "Save transfer" : "Move it") + '</button>' +
    (existing ? '<button class="primary ghost" id="mDel">Delete this transfer</button>' : "");
  openSheet(existing ? "Edit transfer" : "Move money", html, function(){
    document.getElementById("mSave").onclick = function(){
      var amt = parseFloat(document.getElementById("mA").value);
      var from = document.getElementById("mF").value, to = document.getElementById("mT").value;
      if(!(amt > 0)) return setErr("Enter an amount above zero.");
      if(from === to) return setErr("Pick two different accounts.");
      var rec = {amt:amt, from:from, to:to, note:document.getElementById("mN").value.trim(),
                 date:document.getElementById("mD").value || todayISO()};
      if(existing) S.transfers.forEach(function(x){ if(x.id === existing.id) Object.assign(x, rec); });
      else { rec.id = uid(); S.transfers.push(rec); }
      save(); closeSheet(); render(); toast(existing ? "Saved" : "Moved " + fmt(amt));
    };
    if(existing) document.getElementById("mDel").onclick = function(){
      S.transfers = S.transfers.filter(function(x){ return x.id !== existing.id; });
      save(); closeSheet(); render(); toast("Deleted");
    };
  });
}
function payoffSheet(cardId){
  var m = compute(), owed = -(m.bal[cardId] || 0);
  var pay = firstOfKind(S.accounts, "bank") || S.settings.defaultAcct;
  if(pay === cardId) pay = "";
  moveSheet(null, {from:pay, to:cardId, amt:owed, note:"Card payment"});
}

function depositSheet(existing){
  var opts = S.accounts.map(function(a){
    var sel = existing ? existing.acct : S.settings.depositAcct;
    return '<option value="' + a.id + '"' + (a.id === sel ? " selected" : "") + '>' + esc(a.name) + '</option>';
  }).join("");
  var html = '<div class="field">' +
      '<div class="fr"><label for="pA">Amount</label><input id="pA" type="number" inputmode="decimal" value="' + (existing ? existing.amt : "") + '" placeholder="0"></div>' +
      (S.accounts.length ? '<div class="fr"><label for="pAcc">Into</label><select id="pAcc">' + opts + '</select></div>' : '') +
      '<div class="fr"><label for="pN">What for</label><input id="pN" value="' + esc(existing ? existing.note : "") + '" placeholder="Monthly money"></div>' +
      '<div class="fr"><label for="pD">Date</label><input id="pD" type="date" value="' + (existing ? existing.date : todayISO()) + '"></div>' +
    '</div><div class="err" id="sheetErr"></div>' +
    '<button class="primary" id="pSave">' + (existing ? "Save changes" : "Add money in") + '</button>' +

}

    '<div style="margin-top:24px;font-size:15px;font-weight:600">Expense types</div>' +
    '<button class="secondary" id="editCats">Edit the types on the home screen</button>' +
    '<div style="margin-top:24px;font-size:15px;font-weight:600">Your data</div>' +
    '<button class="secondary" id="stmtImgBtn">\u6708\u5ea6\u62a5\u8868\u56fe\u7247\uff08\u53d1\u5fae\u4fe1\u7528\uff09</button>' +

        type:e.bill ? "bill" : "daily", acct:nameOf(e.acct), note:e.note||""}); });
      S.deposits.forEach(function(d){ lines.push({date:d.date, amt:+d.amt||0, cat:"Money in",
        type:d.auto ? "monthly" : "deposit", acct:nameOf(d.acct), note:d.note||""}); });
      S.transfers.forEach(function(t){

          acct:nameOf(t.from), note:(t.note||"") + " to " + nameOf(t.to)});
        lines.push({date:t.date, amt:+t.amt||0, cat:"Transfer", type:"transfer in",
          acct:nameOf(t.to), note:(t.note||"") + " from " + nameOf(t.from)});
      });
      lines.sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      var rows = [["date","amount","currency","account","category","type","note"]];
      lines.forEach(function(l){ rows.push([l.date, l.amt.toFixed(2), S.settings.currency, l.acct, l.cat, l.type,
        '"' + String(l.note).replace(/"/g,'""') + '"']); });
      download("money-" + todayISO() + ".csv", rows.map(function(r){ return r.join(","); }).join("\n"), "text/csv");
    };
    document.getElementById("impBtn").onclick = function(){ document.getElementById("impFile").click(); };
    document.getElementById("impFile").onchange = function(){
      var f = this.files && this.files[0]; if(!f) return;
      var r = new FileReader();

        try{
          var o = JSON.parse(r.result);
          S = normalize(o && o.data ? o.data : o);
          save(); closeSheet(); render(); toast("Backup restored");
        }catch(e){ setErr("That file could not be read as a backup."); }
      };
      r.readAsText(f);
    };
  });
}

  bodyEl.querySelectorAll("#billList .bn").forEach(function(i){ S.bills[+i.getAttribute("data-i")].name = i.value; });
  bodyEl.querySelectorAll("#billList .ba").forEach(function(i){ S.bills[+i.getAttribute("data-i")].amt = parseFloat(i.value) || 0; });

}
function downloadStatement(off){
  try{
    var c = cycle(new Date(), off || 0);
    var name = "\u6d88\u8d39\u62a5\u8868-" + c.start.getFullYear() + "-" + pad2(c.start.getMonth()+1) + ".html";
    download(name, statementHTML(off || 0), "text/html;charset=utf-8");
  }catch(e){  toast("Could not build the statement"); }
}
function download(name, text, type){
  try{
    var b = new Blob([text], {type:type}), u = URL.createObjectURL(b);
    var a = document.createElement("a");
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 800);
    toast("File downloaded");
  }catch(e){ toast("Download blocked by the browser"); }
}

/* ---------- Chinese monthly statement ---------- */
function zhD(d){ return (d.getMonth()+1) + "\u6708" + d.getDate() + "\u65e5"; }
function zhFull(d){ return d.getFullYear() + "\u5e74" + zhD(d); }
var ZDOW = ["\u65e5","\u4e00","\u4e8c","\u4e09","\u56db","\u4e94","\u516d"];
function zhDay(s){
  var d = fromISO(s);
  return (d.getMonth()+1) + "\u6708" + d.getDate() + "\u65e5 \u5468" + ZDOW[d.getDay()];
}
function pctOf(v, t){ return t > 0 ? (v / t * 100) : 0; }

function f2(n){ return fmt(n, 2); }
var ZH_CAT = {
  groceries:"\u98df\u6750\u91c7\u8d2d", dining:"\u5916\u51fa\u5c31\u9910", household:"\u5bb6\u5c45\u65e5\u7528",
  furniture:"\u5bb6\u5177\u4e0e\u5bdd\u5177", rides:"\u7f51\u7ea6\u8f66", transit:"\u4ea4\u901a\u51fa\u884c",
  social:"\u793e\u4ea4\u5a31\u4e50", clothing:"\u670d\u9970", personal:"\u4e2a\u4eba\u62a4\u7406",
  electronics:"\u7535\u5b50\u4ea7\u54c1", subs:"\u8ba2\u9605\u4e0e\u8bdd\u8d39", games:"\u6e38\u620f",
  school:"\u5b66\u4e1a\u652f\u51fa", health:"\u533b\u7597\u5065\u5eb7", investing:"\u6295\u8d44",
  betting:"\u535a\u5f69", other:"\u5176\u4ed6"
};
function zhCat(id){ return ZH_CAT[id] || catOf(id).name; }
function statementHTML(off){
  var m = compute(off || 0);

  var rows = S.expenses.filter(function(e){ return inCycle(e.date, c); });
  var total = rows.reduce(function(a,e){ return a + (+e.amt||0); }, 0);
  var today = fromISO(m.today);

  var byCat = {};
  rows.forEach(function(e){ byCat[e.cat] = (byCat[e.cat]||0) + (+e.amt||0); });
  var cats = Object.keys(byCat).map(function(k){ return {c:catOf(k), v:byCat[k]}; })
    .sort(function(a,b){ return b.v - a.v; });

  /* day groups */
  var days = {};
  rows.forEach(function(e){ (days[e.date] = days[e.date] || []).push(e); });
  var dayKeys = Object.keys(days).sort();

  var cur = S.settings.currency;
  var P = [];

    '<div class="stamp">\u5236\u8868\u65e5\uff1a' + zhFull(today) + '<br>\u5e01\u79cd\uff1a' + cur + '</div></header>');

  /* headline numbers */
  P.push('<section class="kpi">' +

    '<div class="k"><span class="kl">\u51c0\u8d44\u4ea7</span><span class="kv' + (m.balance < 0 ? ' neg' : '') + '">' + f2(m.balance) + '</span></div>' +

  /* financial position */

  P.push('<div class="bar3">' +
    '<div class="b3"><span>\u94f6\u884c\u5b58\u6b3e</span><b>' + f2(m.cash) + '</b></div>' +
    '<div class="b3"><span>\u6295\u8d44\u8d26\u6237</span><b>' + f2(m.invested) + '</b></div>' +
    (m.receivable ? '<div class="b3"><span>\u4ed6\u4eba\u6b20\u6b3e\uff08\u5e94\u6536\uff09</span><b class="pos">' + f2(m.receivable) + '</b></div>' : '') +
    '<div class="b3"><span>\u4fe1\u7528\u5361\u6b20\u6b3e</span><b class="' + (m.owed > 0.005 ? 'neg' : '') + '">' +
      (m.owed > 0.005 ? '\u2212' + f2(m.owed) : f2(0)) + '</b></div></div>');
  var acctSub = m.cash + m.invested - m.owed;
  P.push('<table><thead><tr><th>\u8d26\u6237</th><th>\u7c7b\u578b</th><th class="r">\u4f59\u989d</th><th class="r">\u5360\u6bd4</th></tr></thead><tbody>');
  S.accounts.filter(function(a){ return a.kind !== "person"; }).forEach(function(a){
    var b = m.bal[a.id] || 0, credit = a.kind === "credit";
    var shown = credit ? (Math.abs(b) < 0.005 ? 0 : b) : b;

    P.push('<tr><td>' + esc(a.name) + '</td><td class="mut">' + kindZh + '</td>' +

  });
  P.push('<tr class="tot"><td>\u8d26\u6237\u5408\u8ba1</td><td></td><td class="r">' + f2(acctSub) + '</td><td class="r">100%</td></tr>');
  P.push('</tbody></table>');

    P.push('<table><thead><tr><th>\u6b20\u6b3e\u4eba</th><th class="r">\u91d1\u989d</th><th class="r">\u72b6\u6001</th></tr></thead><tbody>');
    people.forEach(function(a){

        '<td class="r mut">' + (b > 0.005 ? "\u672a\u7ed3\u6e05" : "\u5df2\u7ed3\u6e05") + '</td></tr>');
    });
    P.push('<tr class="tot"><td>\u5408\u8ba1</td><td class="r">' + f2(m.receivable) + '</td><td></td></tr>');
    P.push('</tbody></table>');
    P.push('<table class="gap"><tbody><tr class="tot"><td>\u51c0\u8d44\u4ea7\uff08\u8d26\u6237\u5408\u8ba1 + \u5e94\u6536\uff09</td>' +
      '<td class="r">' + f2(m.balance) + '</td></tr></tbody></table>');
  }

  /* spending by category */
  P.push('<h2>\u4e8c\u3001\u672c\u671f\u652f\u51fa\u5206\u7c7b</h2>');
  if(!cats.length){ P.push('<p class="mut">\u672c\u671f\u6ca1\u6709\u652f\u51fa\u8bb0\u5f55\u3002</p>'); }
  else{
    P.push('<table><thead><tr><th>\u7c7b\u522b</th><th class="r">\u91d1\u989d</th><th class="r">\u5360\u6bd4</th><th class="w">\u5206\u5e03</th></tr></thead><tbody>');
    cats.forEach(function(x){
      var pc = pctOf(x.v, total);
      P.push('<tr><td><i class="dot" style="background:' + x.c.color + '"></i>' + esc(zhCat(x.c.id)) + '</td>' +
        '<td class="r">' + f2(x.v) + '</td><td class="r">' + pc.toFixed(1) + '%</td>' +
        '<td class="w"><i class="bar" style="width:' + (x.v / cats[0].v * 100).toFixed(1) + '%;background:' + x.c.color + '"></i></td></tr>');
    });

    P.push('</tbody></table>');
  }

  /* full detail */
  P.push('<h2 class="brk">\u4e09\u3001\u6bcf\u65e5\u660e\u7ec6</h2>');
  dayKeys.forEach(function(k){
    var list = days[k].slice().sort(function(a,b){ return b.amt - a.amt; });
    var dt = list.reduce(function(a,e){ return a + (+e.amt||0); }, 0);
    P.push('<div class="dayhd"><span>' + zhDay(k) + '</span><span>' + f2(dt) + '</span></div>');
    P.push('<table class="tight"><tbody>');
    list.forEach(function(e){
      P.push('<tr><td><i class="dot" style="background:' + catOf(e.cat).color + '"></i>' + esc(e.note || zhCat(e.cat)) + '</td>' +
        '<td class="mut">' + esc(zhCat(e.cat)) + '</td>' +
        '<td class="mut">' + esc(nameOf(e.acct)) + '</td>' +
        '<td class="r">' + f2(e.amt) + '</td></tr>');
    });
    P.push('</tbody></table>');
  });

  P.push('<footer>\u672c\u62a5\u8868\u7531\u300c\u6bcf\u65e5\u5f00\u9500\u300d\u6839\u636e\u4f60\u81ea\u5df1\u767b\u8bb0\u7684\u8bb0\u5f55\u751f\u6210\uff0c' +
    '\u91d1\u989d\u5355\u4f4d\uff1a' + cur + '\u3002</footer>');
  P.push('</div></body></html>');
  return P.join("");
}
